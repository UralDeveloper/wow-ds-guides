name: Deploy front to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in front/js/*.js front/js/ui/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front
      - id: deployment
        uses: actions/deploy-pages@v4
