# Cloudflare Worker: фронт Activity (статика) + комнаты синхронизации (/ws)
name = "wow-rooms"
main = "worker/src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./front"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Бесплатный тариф поддерживает только Durable Objects на SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
